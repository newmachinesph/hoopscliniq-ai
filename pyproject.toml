[project]
name = "hoopscliniq-ai"
version = "0.3.1"
description = "Hoops ClinIQ hackathon backend: phone video to tagged plays (SAM 3.1 + Muse Spark on Modal)."
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "openai>=1.99",
  "pydantic>=2.8",
  "numpy>=2.0",
  "pillow>=10.4",
  "python-multipart>=0.0.9",
  "sentry-sdk[fastapi]>=2.10",
  "modal>=1.0",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "python-dotenv>=1.0", "imageio-ffmpeg>=0.5"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["eval/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
